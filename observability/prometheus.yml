global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'neurotrader-dev'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  # ====== NEUROTRADER BACKEND ======
  - job_name: 'neurotrader-backend'
    static_configs:
      - targets: ['neurotrader-backend:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ====== PROMETHEUS (self-monitoring) ======
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']